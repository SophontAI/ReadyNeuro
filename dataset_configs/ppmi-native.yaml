# PPMI native-from-raw eval (Parkinson's vs prodromal, REST) -- the FROM-RAW half of the A/B.
# Run with:  python -m readyneuro.builder.driver --config dataset_configs/ppmi-native.yaml
#
# Built from the RAW unprocessed T1 + REST BOLD by the shared OpenNeuro from-raw kernel
# (N4 -> SynthSeg -> SynthMorph rigid to MNI152NLin2009cAsym -> mcflirt -> rigid EPI->T1 -> one
# composed resample). Needs FreeSurfer + FSL (mcflirt) + ANTs (N4) + FS_LICENSE. CPU.
dataset: ppmi_native
spaces: [native]

# Grid geometry and N4 are FIXED in the from-raw kernel (preprocess/openneuro.py:
# T1_MM 1.0 / BOLD_MM 2.0 / N4_SHRINK 4 / TEMPLATE MNI152NLin2009cAsym), not config knobs.

target_tr:      1.0   # temporal resample target (model rate)
min_func_coverage: 0.60  # reject a run covering < 60% of the anatomical brain
common_tr:      3.0   # PPMI mixes 1.0/2.5 s -> low-pass to the corpus-slowest Nyquist
window_seconds: 300   # first 5-min REST window
window_frames:  300   # fixed 5-min window @ 1.0 s: clip a longer run, tile-pad a shorter one
min_frames:     150   # drop only a DEGENERATE run with fewer than this many real frames

# --- I/O ---
input_profile: r2
eval_root:     s3://<RESTRICTED_ROOT>/ppmi-eval  # shared store: native + mni sit side by side
out_profile:   r2

# --- driver execution ---
results_dir: /data/build/ppmi_native
scratch:     /data/scratch/ppmi_native
workers:     1
